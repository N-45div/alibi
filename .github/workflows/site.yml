name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: site checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # the published data, copied from production the same way preview builds get it
      - run: npm run data
      - run: npm run build
      # unit tests (ledger links, the Delvetown checker, the receipts logic) and the data checks
      - run: npm test
